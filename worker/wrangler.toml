# padelticker-refresh — the FALLBACK data worker (see worker/index.js).
# Primary producer is the laptop daemon (scripts/refresh-loop.js); this worker
# stands by while the daemon is producing and takes over when it goes quiet.
#
# Designed for the FREE Workers plan: one source per firing (≤50 subrequests),
# blobs stored in the existing D1 database (no KV — its free write quota is too
# small), gentle fallback cadence. No new Cloudflare resources needed.
#
# This is a SEPARATE Cloudflare app from the Pages project in the repo root's
# wrangler.toml; deploy it explicitly with:
#
#   npx wrangler deploy -c worker/wrangler.toml
#
# Optional secrets (Web Push + webhook alerts while it's the active producer):
#   npx wrangler secret put VAPID_PRIVATE_KEY -c worker/wrangler.toml
#   npx wrangler secret put ALERT_WEBHOOK_URL -c worker/wrangler.toml

name = "padelticker-refresh"
main = "index.js"
compatibility_date = "2026-07-01"
# nodejs_compat: src/health-history.js + src/calendar-refresh.js import node:fs/
# node:path for their Node-side branches (never taken here, but the imports must
# resolve at build time).
compatibility_flags = ["nodejs_compat"]

[triggers]
# Every 2 min; worker/index.js decides whether anything is due (standby check is
# a single fetch). Free plan allows 5 cron triggers per account — this is one.
crons = ["*/2 * * * *"]

[alias]
# linkedom's default entry expects Node globals; ship its workerd-safe build.
# (File path, not the "linkedom/worker" subpath: that export only declares an
# `import` condition, which wrangler's alias resolver doesn't match.)
"linkedom" = "../node_modules/linkedom/worker.js"

# Same D1 database the Pages Functions already use — stores the live_blobs table
# (matches/health/rankings/calendar snapshots) plus push subscriptions.
[[d1_databases]]
binding = "DB"
database_name = "padelticker-history"
database_id = "e811bb33-b2ea-44a4-82a3-7a368770c293"

[observability]
enabled = true
