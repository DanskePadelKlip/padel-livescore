# padelticker-refresh — the scheduled data worker (see worker/index.js).
# This is a SEPARATE Cloudflare app from the Pages project in the repo root's
# wrangler.toml; deploy it explicitly with:
#
#   npx wrangler deploy -c worker/wrangler.toml
#
# One-time setup (see README "Deploy"):
#   1. npx wrangler kv namespace create padelticker-live
#      → paste the returned id below AND into the root wrangler.toml [[kv_namespaces]]
#   2. npx wrangler secret put VAPID_PRIVATE_KEY -c worker/wrangler.toml
#      npx wrangler secret put ALERT_WEBHOOK_URL -c worker/wrangler.toml   (optional)
#   3. npx wrangler deploy -c worker/wrangler.toml
#
# ⚠ Requires the Workers PAID plan ($5/mo): a live refresh cycle exceeds the free
# tier's 50 subrequests, and 60s live cadence exceeds its 1000 KV writes/day.

name = "padelticker-refresh"
main = "index.js"
compatibility_date = "2026-07-01"
# nodejs_compat: src/health-history.js + src/calendar-refresh.js import node:fs/
# node:path for their Node-side branches (never taken here, but the imports must
# resolve at build time).
compatibility_flags = ["nodejs_compat"]

[triggers]
# Fires every minute; worker/index.js self-paces (live 1 min / upcoming 10 min /
# idle 30 min), so most firings are a single KV read + immediate exit.
crons = ["* * * * *"]

[alias]
# linkedom's default entry expects Node globals; ship its workerd-safe build.
# (File path, not the "linkedom/worker" subpath: that export only declares an
# `import` condition, which wrangler's alias resolver doesn't match.)
"linkedom" = "../node_modules/linkedom/worker.js"

[[kv_namespaces]]
binding = "LIVE"
id = "REPLACE_WITH_padelticker-live_NAMESPACE_ID" # from: npx wrangler kv namespace create padelticker-live

# Same D1 database the Pages Functions use (push subscriptions + history).
[[d1_databases]]
binding = "DB"
database_name = "padelticker-history"
database_id = "e811bb33-b2ea-44a4-82a3-7a368770c293"

[observability]
enabled = true
