name: Refresh livescore

# Runs the fetch, then redeploys public/ (with the fresh matches.json) to
# Cloudflare Pages. Every source is now plain fetch + linkedom (no browser), so
# this just needs Node — no Playwright/Chromium install.
#
# Requires two repo secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   — a Cloudflare "Pages: Edit" token
#   CLOUDFLARE_ACCOUNT_ID  — your Cloudflare account id
#
# NOTE ON COST: GitHub Actions minutes are limited on PRIVATE repos (~2000/mo
# free). Any useful cadence exceeds that — see README "Deploy" for options
# (make the repo public for unlimited minutes, use a self-hosted runner, etc.).
#
# ⚠ SUPERSEDED as the data path: GitHub throttled this cron to every 4–14 h in
# practice — the scheduled worker (worker/) is now the primary producer, writing
# to KV that functions/data/*.json.js serve first. Once the worker is verified
# in production (README "Worker setup"), drop the cron + "Fetch matches" step
# here and keep this workflow as deploy-on-push for code. Until then it's a
# harmless fallback: fetch-live.js defers alerts/push when the worker owns them.

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 min (adjust to taste / budget)
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: refresh-livescore
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch matches
        run: node scripts/fetch-live.js
        env:
          # optional: a Discord/Slack webhook to receive "now live" alerts
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Web Push fan-out to followers (reads subscriptions from D1)
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: mailto:danskepadelklip@gmail.com
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Cache-bust app.js (index.html is no-cache, .js gets a long browser TTL)
        run: sed -i "s|app\.js?v=[A-Za-z0-9]*|app.js?v=${GITHUB_SHA::8}|" public/index.html
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
