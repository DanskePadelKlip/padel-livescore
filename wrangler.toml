name = "padel-livescore"
pages_build_output_dir = "public"
compatibility_date = "2026-07-01"

# Historic results DB (Phase 2: player profiles, search, head-to-head).
# Bound as env.DB in Pages Functions under functions/.
[[d1_databases]]
binding = "DB"
database_name = "padelticker-history"
database_id = "e811bb33-b2ea-44a4-82a3-7a368770c293"
# (The fallback worker in worker/ shares this database: it stores its live-data
# snapshots in a `live_blobs` table that functions/data/*.json.js read whenever
# they're fresher than the deployed static files. No extra bindings needed.)
