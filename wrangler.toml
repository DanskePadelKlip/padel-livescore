name = "padel-livescore"
pages_build_output_dir = "public"
compatibility_date = "2026-07-01"

# Historic results DB (Phase 2: player profiles, search, head-to-head).
# Bound as env.DB in Pages Functions under functions/.
[[d1_databases]]
binding = "DB"
database_name = "padelticker-history"
database_id = "e811bb33-b2ea-44a4-82a3-7a368770c293"

# Live-data KV, written by the scheduled worker (worker/) and read by
# functions/data/*.json.js so /data/matches.json etc. are fresh WITHOUT a
# redeploy. UNCOMMENT once the namespace exists (functions gracefully fall back
# to the baked static files until then):
#   npx wrangler kv namespace create padelticker-live
# then paste the id here AND in worker/wrangler.toml.
# [[kv_namespaces]]
# binding = "LIVE"
# id = "REPLACE_WITH_padelticker-live_NAMESPACE_ID"
